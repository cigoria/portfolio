<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Who's watching?</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: #141414;
        color: #fff;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      h1 {
        font-size: 2.5rem;
        font-weight: 500;
        margin-bottom: 2rem;
      }

      .profile-selection {
        display: flex;
        gap: 3rem;
      }

      .profile-option {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.3s ease;
      }

      .profile-avatar {
        width: 130px;
        height: 130px;
        border-radius: 8px;
        margin-bottom: 1rem;
        border: 3px solid transparent;
        transition: border-color 0.3s ease;
        object-fit: cover;
      }

      .profile-option:hover {
        transform: scale(1.05);
      }

      .profile-option:hover .profile-avatar {
        border-color: #fff;
      }

      .profile-name {
        color: #808080;
        font-size: 1.2rem;
        transition: color 0.3s ease;
      }

      .profile-option:hover .profile-name {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <h1>Who's watching?</h1>
    <div class="profile-selection" id="profile-selection"></div>

    <script>
      const profiles = [
        {
          name: "zeti1223",
          avatar: "https://github.com/zeti1223.png",
          url: "https://zeteny.cigoria.eu"
        },
        {
          name: "FonixPython",
          avatar: "https://github.com/FonixPython.png",
          url: "https://skyfonix.cigoria.eu" 
        }
      ];

      const container = document.getElementById("profile-selection");

      profiles.forEach((p) => {
        const a = document.createElement("a");
        a.className = "profile-option";
        a.href = p.url;
        a.innerHTML = `
          <img src="${p.avatar}" class="profile-avatar" alt="${p.name}" />
          <span class="profile-name">${p.name}</span>
        `;
        container.appendChild(a);
      });
    </script>
  </body>
</html>
